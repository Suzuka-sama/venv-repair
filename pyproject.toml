[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "venv-repair"
version = "1.0.0"
description = "Repair a Windows Python venv whose folder was renamed or moved, in place, without reinstalling packages."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Suzuka-sama" }]
keywords = ["venv", "virtualenv", "windows", "relocate", "rename", "launcher", "pip", "shebang"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Suzuka-sama/venv-repair"
Issues = "https://github.com/Suzuka-sama/venv-repair/issues"

[project.scripts]
venv-repair = "venv_repair:main"

[tool.setuptools]
py-modules = ["venv_repair"]
